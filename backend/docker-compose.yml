services:
  postgres:
    image: postgres:16-alpine
    container_name: sacramento_db
    environment:
      POSTGRES_USER: sacramento
      POSTGRES_PASSWORD: sacramento123
      POSTGRES_DB: sacramento_finance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sacramento -d sacramento_finance"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
