services:
  postgres:
    image: postgres:16-alpine
    container_name: sacramento_db
    environment:
      POSTGRES_USER: ${DB_USER:-sacramento}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sacramento123}
      POSTGRES_DB: ${DB_NAME:-sacramento_finance}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sacramento} -d ${DB_NAME:-sacramento_finance}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sacramento_api
    environment:
      SERVER_MODE: ${SERVER_MODE:-release}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DB_USER:-sacramento}
      DATABASE_PASSWORD: ${DB_PASSWORD:-sacramento123}
      DATABASE_NAME: ${DB_NAME:-sacramento_finance}
      DATABASE_SSL_MODE: disable
      AUTH_JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please}
      AUTH_ACCESS_TOKEN_DURATION: ${ACCESS_TOKEN_DURATION:-15m}
      AUTH_REFRESH_TOKEN_DURATION: ${REFRESH_TOKEN_DURATION:-168h}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USERNAME: ${EMAIL_USERNAME:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@sacramento.finance}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sacramento_frontend
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
